name: Deploy to Firebase (ffprod / ffdev)

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to deploy (ffprod or ffdev)'
        required: true
        default: 'ffprod'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Check for lockfile (debug)
      run: |
        ls functions/package-lock.json || echo "Lockfile not found"

    - name: Install dependencies in functions/
      run: |
        cd functions
        npm ci

    - name: Setup service account key (FFPROD)
      if: github.event.inputs.env == 'ffprod'
      run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_INUICHIBA_FFPROD }}' > $HOME/gcloud.json

    - name: Setup service account key (FFDEV)
      if: github.event.inputs.env == 'ffdev'
      run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_INUICHIBA_FFDEV }}' > $HOME/gcloud.json

    - name: Set GOOGLE_APPLICATION_CREDENTIALS
      run: echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud.json" >> $GITHUB_ENV

    - name: Set Firebase Config (FFPROD)
      if: github.event.inputs.env == 'ffprod'
      run: |
        firebase functions:config:set \
          line.token.ffprod="${{ secrets.CHANNEL_ACCESS_TOKEN_PROD }}" \
          line.secret.ffprod="${{ secrets.CHANNEL_SECRET_PROD }}" \
          supabase.roll.key="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          --project=inuichiba-ffprod

    - name: Deploy to Firebase (FFPROD)
      if: github.event.inputs.env == 'ffprod'
       gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
        gcloud config set project $GCP_PROJECT
        gcloud functions deploy webhook \
          --gen2 \
          --region=asia-northeast1 \
          --runtime=nodejs20 \
          --trigger-http \
          --allow-unauthenticated \
          --set-env-vars="CHANNEL_ACCESS_TOKEN=${{ secrets.CHANNEL_ACCESS_TOKEN_PROD }},CHANNEL_SECRET=${{ secrets.CHANNEL_SECRET_PROD }},SUPABASE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -source=functions

    - name: Deploy to Firebase (FFDEV)
      if: github.event.inputs.env == 'ffdev'
      run: |
        gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
        gcloud config set project $GCP_PROJECT
        gcloud functions deploy webhook \
          --gen2 \
          --region=asia-northeast1 \
          --runtime=nodejs20 \
          --trigger-http \
          --allow-unauthenticated \
          --set-env-vars="CHANNEL_ACCESS_TOKEN=${{ secrets.CHANNEL_ACCESS_TOKEN_DEV }},CHANNEL_SECRET=${{ secrets.CHANNEL_SECRET_DEV }},SUPABASE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          --source=functions \
          --project=inuichiba-ffprod


