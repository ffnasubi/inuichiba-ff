name: Supabase & Firebase Ping

on:
  schedule:
    - cron: '0 0 1,5,10,15,20,25,30 * *'  # 📆 Supabase ping（JST 9:00）
    - cron: '0 0 * * *'                  # ☀️ Firebase ping（毎朝 JST 9:00）
    - cron: '0 12 * * *'                 # 🌙 Firebase ping（毎晩 JST 21:00）
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Ping Supabase tables
        run: |
          echo "🔁 Supabase 複数テーブルの ping を開始します..."
          for table in users_ffprod users_ffdev users_prod; do
            echo ""
            echo "🔸 $table を ping 中..."
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              "${{ secrets.SUPABASE_PROJECT_URL }}/rest/v1/$table")

            echo "✅ [$table] → ステータスコード: $status"

            if [ "$status" != "200" ]; then
              echo "⚠️ [$table] はステータス200ではありません！"
            fi
          done

  ping-firebase:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Daily(半日に一度) Firebase Ping (for ffprod only)
        run: |
          echo "🚀 Firebase Function に ping を送信しています..."
          status=$(curl -s -o /dev/null -w "%{http_code}" https://asia-northeast1-inuichiba-ffprod.cloudfunctions.net/ping)


          echo "✅ Firebase webhook ステータスコード: $status"

          if [ "$status" != "200" ]; then
            echo "⚠️ Firebase webhook が200以外を返しました！"
          fi