name: Monthly Supabase Ping

on:
  schedule:
    - cron: '0 0 1,5,10,15,20,25,30 * *'  # 毎月の 1・5・10・15・20・25・30 日の日本時間9:00(JST) に対応するUTC 0:00 に実行
  workflow_dispatch:                      # 手動でも実行できるように

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase tables
        run: |
          echo "🔁 Supabase 複数テーブルの ping を開始します..."
          for table in users_ffprod users_ffdev users_prod; do
            echo ""
            echo "🔸 $table を ping 中..."
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              "${{ secrets.SUPABASE_PROJECT_URL }}/rest/v1/$table")

            echo "✅ [$table] → ステータスコード: $status"

            if [ "$status" != "200" ]; then
              echo "⚠️ [$table] はステータス200ではありません！"
            fi
          done

