name: Monthly Supabase Ping

on:
  schedule:
    - cron: '0 3 1 * *'  # 毎月1日 日本時間12:00（JST）に実行
  workflow_dispatch:       # 手動でも実行できるように

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase tables
        run: |
          echo "🔁 Supabase 複数テーブルの ping を開始します..."
          for table in healthcheck_view users_ffprod users_ffdev users_prod; do
            echo ""
            echo "🔸 $table を ping 中..."
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              "${{ secrets.SUPABASE_PROJECT_URL }}/rest/v1/$table")

            echo "✅ [$table] → ステータスコード: $status"

            if [ "$status" != "200" ]; then
              echo "⚠️ [$table] はステータス200ではありません！"
            fi
          done

